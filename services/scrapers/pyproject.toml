[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vexalyn-scrapers"
version = "0.0.1"
description = "VEXALYN scraper services for donghua, anime, and manga providers"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
